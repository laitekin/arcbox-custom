// Machine service protocol definitions.
//
// This service manages virtual machines.
//
// Design sources:
// - internal-docs/architecture/cli-api.md (MachineCommands section)
// - OrbStack's machine management API (conceptual reference)
// - Lima VM management interface patterns

syntax = "proto3";

package arcbox.v1;

import "api.proto";
import "common.proto";

// MachineService manages Linux virtual machines. macOS guests are disposable,
// single-purpose VMs with a separate lifecycle and live in MacosService.
service MachineService {
    // Creates a new virtual machine.
    rpc Create(CreateMachineRequest) returns (CreateMachineResponse);

    // Starts a stopped machine and returns once it is usable.
    //
    // "Usable" means the distro's own init has finished booting, not merely
    // that the agent answers: the boot shim backgrounds the agent before
    // exec'ing /sbin/init, and that init reconfigures the network from
    // scratch, so a call issued in between can fail with ENETUNREACH.
    //
    // Budget for the distro's boot, not for the VM's: measured ~2.2s on
    // alpine/openrc and ~14s on ubuntu/systemd, against ~0.5s before ArcBox
    // 0.7.0, which returned into that window rather than after it.
    //
    // Two limits, because each hands control back other than as stated above:
    //
    //   - Boot completion is observed through a hook the agent installs into
    //     the distro's init, so it needs an init that is recognized (systemd
    //     or openrc). Where none is, or where the install fails, no signal is
    //     coming — and rather than wait out a signal that will never arrive,
    //     Start falls back to the pre-0.7.0 behaviour of returning once the
    //     agent reports a routable IP. The ENETUNREACH window above is then
    //     still reachable.
    //   - The 60s readiness budget is checked between probes, so it bounds
    //     the retry loop rather than any one probe. A guest that accepts the
    //     connection and then stalls mid-answer holds Start open past it.
    //     Keep a client-side timeout; do not treat 60s as a guarantee.
    rpc Start(StartMachineRequest) returns (Empty);

    // Stops a running machine.
    rpc Stop(StopMachineRequest) returns (Empty);

    // Removes a machine.
    rpc Remove(RemoveMachineRequest) returns (Empty);

    // Clones a stopped distro machine into a new one. The clone shares the
    // source's data disk blocks copy-on-write — instant, and no extra space
    // until the two diverge — under its own name, hostname, DNS record and
    // bridge MAC. A running source is refused: its data disk is a btrfs
    // volume mounted read-write in the guest, so stop it first. (Named
    // CloneMachine, not Clone: a `clone` method collides with `Clone::clone`
    // on the generated service handle.)
    rpc CloneMachine(CloneMachineRequest) returns (CloneMachineResponse);

    // Writes a stopped distro machine to a self-contained archive: a
    // zstd-compressed tar holding a manifest (the machine's settings and
    // the published image it boots) and its data disk as a sparse entry.
    // The daemon writes the file, so `path` is a path on its host. A
    // running machine is refused, as for Clone.
    rpc Export(ExportMachineRequest) returns (ExportMachineResponse);

    // Creates a machine from an archive Export wrote. The image the
    // manifest names must be in the local image registry at the same
    // version; otherwise the error says which image is missing.
    rpc Import(ImportMachineRequest) returns (ImportMachineResponse);

    // Changes a machine's CPU and memory limits, checked against the host.
    // The new size is recorded at once and applies at the machine's next
    // start; a running machine keeps the size it booted with, and the
    // response says a restart is needed. The System VM is resized through
    // SystemService.SetSystemVmResources instead, which restarts it.
    rpc SetResources(SetMachineResourcesRequest) returns (SetMachineResourcesResponse);

    // Isolates a stopped machine from the Mac, or lifts its isolation (see
    // CreateMachineRequest.isolated). It applies at the machine's next start;
    // a running machine is refused, so it never keeps shares its record
    // says it does not have.
    rpc SetIsolation(SetMachineIsolationRequest) returns (Empty);

    // Sets the time zone and locale a stopped machine presents; applied at
    // its next start.
    rpc SetIdentity(SetMachineIdentityRequest) returns (Empty);

    // Replaces the ports forwarded from the Mac's loopback into the machine,
    // the way the Mac reaches services of an isolated machine (which has no
    // bridge address). A running machine gets them at once.
    rpc SetPortForwards(SetMachinePortForwardsRequest) returns (Empty);

    // Sets the default machine — the one `abctl machine exec` and
    // `abctl machine ssh` act on when given no name — or clears it with an
    // empty id. The machine must exist. List reports the current one.
    rpc SetDefault(SetDefaultMachineRequest) returns (Empty);

    // Lists machines.
    rpc List(ListMachinesRequest) returns (ListMachinesResponse);

    // Inspects a machine.
    rpc Inspect(InspectMachineRequest) returns (MachineInfo);

    // Pings the guest agent for a machine.
    rpc Ping(MachineAgentRequest) returns (MachinePingResponse);

    // Gets guest system information for a machine.
    rpc GetSystemInfo(MachineAgentRequest) returns (MachineSystemInfo);

    // Compacts a machine's data disk: the guest trims its data filesystems
    // (FITRIM), which discards every free block so the host punches them out
    // of the sparse image. The daemon also does this on its own when the
    // System VM goes idle and hourly for every running machine; this is the
    // on-demand path behind `abctl disk compact`.
    rpc CompactDisk(MachineAgentRequest) returns (Empty);

    // Executes a command in a machine (non-interactive: stdin closed).
    rpc Exec(MachineExecRequest) returns (stream MachineExecOutput);

    // Interactive machine session: the first message must carry `init`;
    // subsequent messages stream stdin bytes and terminal resizes. Output
    // frames mirror Exec, with stdout/stderr merged by the PTY.
    rpc ExecSession(stream MachineExecInput) returns (stream MachineExecOutput);

    // Gets the SSH connection info.
    rpc SSHInfo(SSHInfoRequest) returns (SSHInfoResponse);

    // Subscribes to machine lifecycle events. The stream stays open until the
    // client disconnects. Emitted actions:
    //   "created" | "started" | "idle" | "stopped" | "removed"
    // plus "resync" (empty name) when the server dropped events under load and
    // the client should re-list. Events for the default System VM are included.
    rpc Events(MachineEventsRequest) returns (stream MachineEvent);
}

// Request to create a machine.
message CreateMachineRequest {
    // Machine name.
    string name = 1;
    // Number of CPUs (0 = use the daemon default).
    uint32 cpus = 2;
    // Memory in bytes.
    uint64 memory = 3;
    // Disk size in bytes.
    uint64 disk_size = 4;
    // Linux distribution (e.g., "ubuntu", "alpine").
    string distro = 5;
    // Version of the distribution.
    string version = 6;
    // Architecture (e.g., "aarch64", "x86_64").
    string arch = 7;
    // Directory mounts.
    repeated DirectoryMount mounts = 8;
    // SSH public key.
    string ssh_public_key = 9;
    // Kernel image path.
    string kernel = 10;
    // Field 11 was initrd (removed in schema v6).
    reserved 11;
    // Kernel command line.
    string cmdline = 12;
    // A local machine image to boot, `name` or `name@version` (the newest
    // version when omitted). When set, distro/version/arch are ignored and
    // nothing is downloaded.
    string image = 13;
    // Isolate the machine from the Mac: it gets no share of the Mac's
    // /Users or /private and no share of the daemon's data directory, only a
    // directory of its own. Mounts listed above are still shared. See
    // SetIsolation to change it later.
    //
    // An isolated machine also has no network path to the Mac, its networks
    // or other machines; its traffic goes through its saved proxy or
    // nowhere; and it gets a NIC address and machine ID of its own.
    bool isolated = 14;
    // Time zone the machine presents (`Area/City`); empty keeps the image's.
    string timezone = 15;
    // Locale the machine presents (`en_US.UTF-8`); empty keeps the image's.
    string locale = 16;
}

// Request that targets a machine's guest agent.
message MachineAgentRequest {
    // Machine ID or name.
    string id = 1;
}

// Ping response from machine guest agent.
message MachinePingResponse {
    // Response payload.
    string message = 1;
    // Agent version.
    string version = 2;
}

// System information reported by machine guest agent.
message MachineSystemInfo {
    // Kernel version.
    string kernel_version = 1;
    // OS name.
    string os_name = 2;
    // OS version.
    string os_version = 3;
    // Architecture.
    string arch = 4;
    // Total memory in bytes.
    uint64 total_memory = 5;
    // Available memory in bytes.
    uint64 available_memory = 6;
    // Number of CPUs.
    uint32 cpu_count = 7;
    // Load average (1, 5, 15 minutes).
    repeated double load_average = 8;
    // Hostname.
    string hostname = 9;
    // Uptime in seconds.
    uint64 uptime = 10;
    // Guest IP addresses (excluding loopback).
    repeated string ip_addresses = 11;
    // IPv4 address of the guest's bridge NIC, empty when it has none.
    string bridge_ip_address = 12;
}

// Directory mount configuration.
message DirectoryMount {
    // Host directory path.
    string host_path = 1;
    // Guest mount point.
    string guest_path = 2;
    // Read-only flag.
    bool readonly = 3;
}

// Response to create machine.
message CreateMachineResponse {
    // Machine ID.
    string id = 1;
}

// Request to start a machine.
message StartMachineRequest {
    // Machine ID or name.
    string id = 1;
}

// Request to stop a machine.
message StopMachineRequest {
    // Machine ID or name.
    string id = 1;
    // Force stop.
    bool force = 2;
}

// Request to remove a machine.
message RemoveMachineRequest {
    // Machine ID or name.
    string id = 1;
    // Force removal.
    bool force = 2;
    // Ignored: machine removal always deletes the machine directory
    // (including the data disk). Retained for wire compatibility.
    bool volumes = 3;
}

// Request to list machines.
message ListMachinesRequest {
    // Show all machines (including stopped).
    bool all = 1;
}

// Response to list machines.
message ListMachinesResponse {
    // List of machines.
    repeated MachineSummary machines = 1;
    // The default machine (see SetDefault); empty when none is set.
    string default_machine = 2;
}

// Request to clone a machine.
message CloneMachineRequest {
    // Machine to clone (ID or name); must be stopped.
    string id = 1;
    // Name of the clone.
    string name = 2;
}

// Response to clone machine.
message CloneMachineResponse {
    // The clone's ID.
    string id = 1;
}

// Request to export a machine to an archive.
message ExportMachineRequest {
    // Machine to export (ID or name); must be stopped.
    string id = 1;
    // Where to write the archive, on the daemon's host. Must not exist.
    string path = 2;
    // Carry the machine's image in the archive so a host without it can
    // import the machine. Absent: carry it when the image was imported on
    // this host (no CDN publishes it).
    optional bool include_image = 3;
}

// Response to export machine.
message ExportMachineResponse {
    // The archive written.
    string path = 1;
    // Its size in bytes.
    uint64 size = 2;
}

// Request to import a machine from an archive.
message ImportMachineRequest {
    // The archive, on the daemon's host.
    string path = 1;
    // Name for the machine; empty uses the name in the archive.
    string name = 2;
    // CPUs; 0 uses the archive's value.
    uint32 cpus = 3;
    // Memory in bytes; 0 uses the archive's value.
    uint64 memory = 4;
}

// Response to import machine.
message ImportMachineResponse {
    // The new machine's ID.
    string id = 1;
    // Distribution the machine boots (from the archive).
    string distro = 2;
    // Distribution release.
    string distro_version = 3;
}

// Request to change a machine's CPU and memory limits.
message SetMachineResourcesRequest {
    // Machine ID or name.
    string id = 1;
    // CPUs, 1 through the host's logical CPU count; 0 keeps the current value.
    uint32 cpus = 2;
    // Memory in bytes, 512 MiB through the host's physical memory; 0 keeps
    // the current value.
    uint64 memory = 3;
}

// A machine's CPU and memory limits after SetResources.
message SetMachineResourcesResponse {
    // CPUs the machine boots with from now on.
    uint32 cpus = 1;
    // Memory in bytes the machine boots with from now on.
    uint64 memory = 2;
    // The machine is running with its previous size; the new one applies
    // when it is next started.
    bool restart_required = 3;
    // Logical CPUs on the host, the ceiling for `cpus`.
    uint32 host_cpus = 4;
    // Physical memory on the host in bytes, the ceiling for `memory`.
    uint64 host_memory = 5;
}

// Request to change a machine's isolation.
message SetMachineIsolationRequest {
    // Machine ID or name.
    string id = 1;
    // Whether the machine is isolated from the Mac.
    bool isolated = 2;
}

// Request to change a machine's time zone and locale.
message SetMachineIdentityRequest {
    // Machine ID or name.
    string id = 1;
    // Time zone (`Area/City`); empty keeps the image's.
    string timezone = 2;
    // Locale (`en_US.UTF-8`); empty keeps the image's.
    string locale = 3;
}

// A port on the Mac's loopback forwarded to a port of a machine.
message MachinePortForward {
    // Port on 127.0.0.1 of the Mac.
    uint32 host_port = 1;
    // Port in the machine. Its service must listen on all interfaces, not
    // only on the guest's loopback.
    uint32 guest_port = 2;
    // `tcp` (the default when empty) or `udp`.
    string protocol = 3;
}

// Request to replace a machine's forwarded ports.
message SetMachinePortForwardsRequest {
    // Machine ID or name.
    string id = 1;
    // The forwards; an empty list removes them all.
    repeated MachinePortForward forwards = 2;
}

// Request to set or clear the default machine.
message SetDefaultMachineRequest {
    // Machine ID or name; empty clears the default.
    string id = 1;
}

// Summary information about a machine.
message MachineSummary {
    // Machine ID.
    string id = 1;
    // Machine name.
    string name = 2;
    // State (running, stopped, etc.).
    string state = 3;
    // Number of CPUs.
    uint32 cpus = 4;
    // Memory in bytes.
    uint64 memory = 5;
    // Disk size in bytes.
    uint64 disk_size = 6;
    // IP address.
    string ip_address = 7;
    // Creation timestamp.
    int64 created = 8;
    // Distribution name (e.g., "ubuntu"); empty for plain VMs.
    string distro = 9;
    // Distribution release (e.g., "noble").
    string distro_version = 10;
    // The machine is isolated from the Mac (CreateMachineRequest.isolated).
    bool isolated = 11;
}

// Request to inspect a machine.
message InspectMachineRequest {
    // Machine ID or name.
    string id = 1;
}

// Detailed machine information.
message MachineInfo {
    // Machine ID.
    string id = 1;
    // Machine name.
    string name = 2;
    // State.
    string state = 3;
    // Hardware configuration.
    MachineHardware hardware = 4;
    // Network configuration.
    MachineNetwork network = 5;
    // Storage configuration.
    MachineStorage storage = 6;
    // OS information.
    MachineOS os = 7;
    // Creation timestamp.
    Timestamp created = 8;
    // Last start timestamp.
    Timestamp started_at = 9;
    // Directory mounts.
    repeated DirectoryMount mounts = 10;
    // The machine is isolated from the Mac (CreateMachineRequest.isolated).
    bool isolated = 11;
    // Time zone the machine presents; empty when it keeps the image's.
    string timezone = 12;
    // Locale the machine presents; empty when it keeps the image's.
    string locale = 13;
    // Ports forwarded from the Mac's loopback into the machine.
    repeated MachinePortForward port_forwards = 14;
}

// Machine hardware configuration.
message MachineHardware {
    // Number of CPUs.
    uint32 cpus = 1;
    // Memory in bytes.
    uint64 memory = 2;
    // Architecture.
    string arch = 3;
}

// Machine network configuration.
message MachineNetwork {
    // IP address.
    string ip_address = 1;
    // Gateway.
    string gateway = 2;
    // MAC address.
    string mac_address = 3;
    // DNS servers.
    repeated string dns_servers = 4;
    // MAC address of the bridge NAT NIC used for host-side vmnet routing on macOS.
    string bridge_mac_address = 5;
    // IPv4 address of the bridge NIC: the address the Mac reaches directly
    // and the one `<machine>.arcbox.local` resolves to. Empty until the
    // machine has reported it.
    string bridge_ip_address = 6;
    // The name the host's DNS answers for this machine while it runs
    // (`<machine>.<local domain>`). Empty when the machine has no bridge
    // address to register.
    string dns_name = 7;
}

// Machine storage configuration.
message MachineStorage {
    // Disk size in bytes.
    uint64 disk_size = 1;
    // Disk format.
    string disk_format = 2;
    // Disk path.
    string disk_path = 3;
}

// Machine OS information.
message MachineOS {
    // Distribution name.
    string distro = 1;
    // Version.
    string version = 2;
    // Kernel version.
    string kernel = 3;
}

// Request to execute a command in a machine.
message MachineExecRequest {
    // Machine ID or name.
    string id = 1;
    // Command to execute.
    repeated string cmd = 2;
    // Working directory.
    string working_dir = 3;
    // User to run as.
    string user = 4;
    // Environment variables.
    map<string, string> env = 5;
    // Allocate TTY.
    bool tty = 6;
    // Initial terminal size (interactive sessions).
    TerminalSize tty_size = 7;
    // Feed the process the session's stdin messages (ExecSession only):
    // without a TTY, stdin is /dev/null unless this is set. A TTY session
    // always reads stdin from its terminal.
    bool attach_stdin = 8;
    // Run as a login session of `user` (root when empty), the way sshd does:
    // the environment starts empty and gets HOME, USER, LOGNAME, SHELL and
    // PATH from the account before `env` is applied, the working directory
    // defaults to HOME, and the process is the account's shell — a login
    // shell when `cmd` is empty, otherwise `shell -c` over `cmd` joined with
    // spaces.
    bool login = 9;
    // Flow control between the daemon and the guest agent, set by the
    // daemon when it forwards the request (a client's value is ignored):
    // the agent keeps at most this many bytes of MachineExecOutput frames
    // (encoded payloads, the final frame excepted) unreturned, grants its
    // own stdin window in its first frame, and each side returns window as
    // it consumes (MachineExecWindow frames). 0 streams without flow
    // control.
    uint32 output_window = 10;
    // Container-debug target (see the DebugExecRequest wire message): when
    // set, the exec enters this container's PID, network, IPC and UTS
    // namespaces instead of running in the machine root. Empty for a normal
    // machine exec.
    string container = 11;
}

// One client message on an interactive machine session.
message MachineExecInput {
    oneof payload {
        // Must be the first message: what to run.
        MachineExecRequest init = 1;
        // Raw stdin bytes; empty means stdin EOF.
        bytes stdin = 2;
        // Terminal resize.
        TerminalSize resize = 3;
    }
}

// Exec output from a machine.
message MachineExecOutput {
    // Stream type: stdout or stderr.
    string stream = 1;
    // Output data.
    bytes data = 2;
    // Exit code (only set on completion).
    int32 exit_code = 3;
    // Is this the final message.
    bool done = 4;
    // Signal that terminated the process, without the SIG prefix ("KILL");
    // empty when it exited on its own. Only set on completion, where
    // `exit_code` is then -1.
    string exit_signal = 5;
    // The output has ended: the process closed its stdout and stderr (or
    // the TCP peer of a machine connection stopped sending). Carries no
    // data; the final frame still follows.
    bool eof = 6;
}

// Request for SSH connection info.
message SSHInfoRequest {
    // Machine ID or name.
    string id = 1;
}

// SSH connection information.
message SSHInfoResponse {
    // Host to connect to.
    string host = 1;
    // Port number.
    uint32 port = 2;
    // Username.
    string user = 3;
    // Private key path (if using key-based auth).
    string identity_file = 4;
    // SSH command string.
    string command = 5;
}

// Request to subscribe to machine lifecycle events.
message MachineEventsRequest {
    // Filter by machine ID/name (empty = all machines).
    string id = 1;
    // Filter by event action (empty = all actions).
    string action = 2;
}

// A machine lifecycle event.
message MachineEvent {
    // Machine name (empty for "resync").
    string name = 1;
    // Action:
    //   "created" — machine record created
    //   "started" — VM reached the running state
    //   "idle"    — running VM entered the idle (reduced-resource) state
    //   "stopped" — VM shut down
    //   "removed" — machine deleted
    //   "resync"  — events were dropped under load; re-list to recover
    string action = 2;
    // Unix nanoseconds.
    int64 timestamp = 3;
    // Additional context (reserved; e.g. error detail on future actions).
    map<string, string> attributes = 4;
}

// MachineImageService manages the local Linux machine image registry:
// published images pulled by machine creation, and root filesystems the
// user imports.
service MachineImageService {
    // Lists local images, with the machines that boot each.
    rpc List(ListMachineImagesRequest) returns (ListMachineImagesResponse);

    // Lists the images the configured image source publishes, fetched by
    // the daemon through the egress proxy.
    rpc ListRemote(ListRemoteMachineImagesRequest) returns (ListRemoteMachineImagesResponse);

    // Imports a root filesystem as a local image, streaming progress. The
    // last event carries the image.
    rpc Import(ImportMachineImageRequest) returns (stream ImportMachineImageEvent);

    // Removes a local image; refused while a machine boots from it.
    rpc Remove(RemoveMachineImageRequest) returns (Empty);
}

// A local machine image.
message MachineImageInfo {
    // Image name (the stream, e.g. `ubuntu-noble-arm64` or `my-ubuntu`).
    string name = 1;
    // Version label.
    string version = 2;
    // Distro id.
    string distro = 3;
    // Distro release.
    string release = 4;
    // Human-readable release title.
    string release_title = 5;
    // Image architecture (`arm64`).
    string arch = 6;
    // Imported on this host rather than pulled from the image source.
    bool imported = 7;
    // Provenance: the upstream product, or what the import read.
    string source = 8;
    // Rootfs size in bytes.
    uint64 size = 9;
    // Rootfs SHA-256.
    string sha256 = 10;
    // Machines booting this image.
    repeated string machines = 11;
}

// Request to list local images.
message ListMachineImagesRequest {}

// Local images.
message ListMachineImagesResponse {
    repeated MachineImageInfo images = 1;
}

// Request to list published images.
message ListRemoteMachineImagesRequest {
    // Architecture (`arm64`, `aarch64`); empty means this host's.
    string arch = 1;
}

// One published image stream.
message RemoteMachineImage {
    // Stream name.
    string name = 1;
    // Distro id.
    string distro = 2;
    // Distro release.
    string release = 3;
    // Human-readable release title.
    string release_title = 4;
    // Image architecture.
    string arch = 5;
    // The version a pull resolves to.
    string latest = 6;
}

// Published images.
message ListRemoteMachineImagesResponse {
    repeated RemoteMachineImage images = 1;
    // The image source the list came from.
    string base = 2;
}

// Request to import a root filesystem. Exactly one of `path` and
// `docker_image` is set.
message ImportMachineImageRequest {
    // Name for the image: 1-63 lowercase letters, digits, `.`, `-`, `_`.
    string name = 1;
    // A rootfs archive (tar, tar.gz, tar.xz, tar.zst) or squashfs image, by
    // absolute path on the daemon's host. Disk images (qcow2, VMDK, VHDX,
    // VDI, raw disks and bare ext filesystems) are not importable yet and
    // fail with INVALID_ARGUMENT naming the format.
    string path = 2;
    // A Docker image in the System VM's engine, exported as the rootfs.
    string docker_image = 3;
    // Overrides the distro id read from os-release.
    string distro = 4;
    // Overrides the release read from os-release.
    string release = 5;
    // Refuses larger root filesystems; 0 means 20 GiB.
    uint64 max_size = 6;
    // With `docker_image`: first build a derived image with an init system
    // installed (systemd, or openrc on Alpine), import that, then remove it.
    bool add_init = 7;
}

// Import stages.
enum ImportMachineImagePhase {
    IMPORT_MACHINE_IMAGE_PHASE_UNSPECIFIED = 0;
    // Exporting the Docker image's filesystem.
    IMPORT_MACHINE_IMAGE_PHASE_EXPORTING = 1;
    // Reading the root filesystem; `bytes` read so far.
    IMPORT_MACHINE_IMAGE_PHASE_READING = 2;
    // Checking init, architecture and os-release.
    IMPORT_MACHINE_IMAGE_PHASE_CHECKING = 3;
    // Writing the squashfs.
    IMPORT_MACHINE_IMAGE_PHASE_WRITING = 4;
    // Hashing and registering; `bytes` is the image size.
    IMPORT_MACHINE_IMAGE_PHASE_REGISTERING = 5;
    // Finished; `image` and `warnings` are set.
    IMPORT_MACHINE_IMAGE_PHASE_DONE = 6;
    // Building the derived image with an init system (`add_init`).
    IMPORT_MACHINE_IMAGE_PHASE_BUILDING = 7;
}

// Import progress.
message ImportMachineImageEvent {
    ImportMachineImagePhase phase = 1;
    uint64 bytes = 2;
    // The registered image (DONE only).
    MachineImageInfo image = 3;
    // Non-fatal findings (DONE only).
    repeated string warnings = 4;
}

// Request to remove a local image.
message RemoveMachineImageRequest {
    // Image name.
    string name = 1;
    // Version; empty when the name has a single version.
    string version = 2;
}
